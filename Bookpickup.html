
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LAVÉRA | Book Pickup</title>

<link rel="icon" type="image/png" href="Images/LLOGOO.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
:root {
  --forest: #496B50;
  --forest-dark: #304B36;
  --sage: #A8B99A;
  --cream: #F8F7EF;
  --white: #FFFFFF;
  --gold: #D5B46A;
  --text: #26372A;
  --muted: #777D73;
  --border: #E5E5DA;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: "DM Sans", sans-serif;
  background: var(--cream);
  color: var(--text);
  min-height: 100vh;
}

/* PAGE BACKGROUND */

.booking-page {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 35px 18px;
  background:
    radial-gradient(circle at top left, rgba(168,185,154,.25), transparent 35%),
    var(--cream);
}

/* BOOKING CONTAINER */

.booking-container {
  width: 100%;
  max-width: 760px;
  background: var(--white);
  border: 1px solid rgba(213,180,106,.65);
  border-radius: 16px;
  padding: 38px;
  box-shadow: 0 20px 65px rgba(48,75,54,.12);
  animation: slideUp .6s ease;
}

@keyframes slideUp {
  from {
    opacity: 0;
    transform: translateY(25px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* BRAND */

.booking-brand {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 15px;
  padding-bottom: 22px;
  margin-bottom: 28px;
  border-bottom: 1px solid var(--border);
}

.booking-logo {
  display: flex;
  align-items: center;
  text-decoration: none;
}

.booking-logo img {
  width: 155px;
  height: 70px;
  object-fit: contain;
}

.booking-premium {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 10px 15px;
  border: 1px solid var(--gold);
  border-radius: 30px;
  color: var(--forest);
  background: #FBF8EF;
  font-size: 9px;
  font-weight: 800;
  letter-spacing: 1px;
}

.booking-premium i {
  color: #B58D3B;
}

/* HEADING */

.booking-heading {
  text-align: center;
  margin-bottom: 30px;
}

.booking-heading span {
  display: block;
  color: var(--forest);
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 2px;
  margin-bottom: 12px;
}

.booking-heading h1 {
  font-family: "Playfair Display", serif;
  font-size: 38px;
  color: var(--forest-dark);
  margin-bottom: 12px;
}

.booking-heading h1 em {
  color: #B58D3B;
}

.booking-heading p {
  color: var(--muted);
  font-size: 13px;
  line-height: 1.8;
}

.heading-line {
  width: 55px;
  height: 2px;
  background: var(--gold);
  margin: 18px auto 0;
}

/* FORM */

.booking-form-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 20px;
}

.booking-field {
  display: flex;
  flex-direction: column;
  gap: 9px;
}

.booking-field.full {
  grid-column: 1 / -1;
}

.booking-field label {
  color: var(--forest-dark);
  font-size: 12px;
  font-weight: 700;
}

.booking-field input,
.booking-field select,
.booking-field textarea {
  width: 100%;
  padding: 14px;
  background: #FFF;
  border: 1px solid var(--border);
  border-radius: 7px;
  outline: none;
  color: #333;
  font-family: inherit;
  font-size: 13px;
  transition: .3s ease;
}

.booking-field input:focus,
.booking-field select:focus,
.booking-field textarea:focus {
  border-color: var(--forest);
  box-shadow: 0 0 0 3px rgba(73,107,80,.09);
}

.booking-field textarea {
  resize: vertical;
}

/* BUTTON */

.booking-submit {
  width: 100%;
  margin-top: 25px;
  padding: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  background: linear-gradient(135deg, var(--forest), var(--forest-dark));
  border: 1px solid var(--gold);
  border-radius: 7px;
  color: white;
  font-family: inherit;
  font-size: 14px;
  font-weight: 800;
  cursor: pointer;
  transition: .35s ease;
}

.booking-submit i {
  color: var(--gold);
  transition: .3s ease;
}

.booking-submit:hover {
  transform: translateY(-3px);
  box-shadow: 0 10px 25px rgba(48,75,54,.22);
}

.booking-submit:hover i {
  transform: translateX(5px);
}

/* MESSAGE */

.booking-message {
  margin-top: 18px;
  text-align: center;
  font-size: 13px;
  font-weight: 700;
  line-height: 1.7;
  color: var(--forest);
}

/* BACK LINK */

.booking-back {
  display: flex;
  justify-content: center;
  margin-top: 22px;
}

.booking-back a {
  color: var(--forest);
  font-size: 12px;
  font-weight: 700;
  text-decoration: none;
  transition: .3s;
}

.booking-back a:hover {
  color: #B58D3B;
}

/* RESPONSIVE */

@media(max-width: 600px) {
  .booking-container {
    padding: 25px 17px;
  }

  .booking-brand {
    flex-direction: column;
    align-items: flex-start;
  }

  .booking-logo img {
    width: 135px;
    height: 60px;
  }

  .booking-heading h1 {
    font-size: 30px;
  }

  .booking-form-grid {
    grid-template-columns: 1fr;
    gap: 16px;
  }

  .booking-field.full {
    grid-column: auto;
  }
}
.brand-icon {
  width: 65px;
  height: 65px;
  border-radius: 50%;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.brand-icon img {
  width: 100%;
  height: 100%;
  border-radius: 50%;
  object-fit: cover;
  display: block;
}
</style>
</head>

<body>

<main class="booking-page">

  <section class="booking-container">

    <!-- BRAND -->
    <div class="booking-brand">

<a href="index.html" class="brand">
  <span class="brand-icon">
    <img src="images/LLOGOO.png" alt="LAVÉRA Logo">
  </span>

  <span class="brand-text">
    <strong>LAVÉRA</strong>
    <small>LAUNDRY & DRY CLEANING</small>
  </span>
</a>

    </div>

    <!-- HEADING -->
    <div class="booking-heading">

      <span>EFFORTLESS FABRIC CARE</span>

      <h1>Book Your <em>Pickup</em></h1>

      <p>
        Experience premium laundry care at your doorstep.
        Schedule your convenient pickup today.
      </p>

      <div class="heading-line"></div>

    </div>

    <!-- BOOKING FORM -->
    <form id="pickupForm">

      <div class="booking-form-grid">

        <div class="booking-field">
          <label for="customerName">Full Name *</label>
          <input type="text" id="customerName"
            placeholder="Enter your full name" required>
        </div>

        <div class="booking-field">
          <label for="customerPhone">Phone Number *</label>
          <input type="tel" id="customerPhone"
            placeholder="Enter 10-digit number"
            pattern="[0-9]{10}" maxlength="10" required>
        </div>

        <div class="booking-field">
          <label for="customerEmail">Email Address</label>
          <input type="email" id="customerEmail"
            placeholder="Enter your email">
        </div>

        <div class="booking-field">
          <label for="service">Select Service *</label>
          <select id="service" required>
            <option value="">Choose Service</option>
            <option>Wash & Fold</option>
            <option>Dry Cleaning</option>
            <option>Ironing</option>
            <option>Stain Removal</option>
            <option>Premium Fabric Care</option>
          </select>
        </div>

        <div class="booking-field">
          <label for="pickupDate">Pickup Date *</label>
          <input type="date" id="pickupDate" required>
        </div>

        <div class="booking-field">
          <label for="pickupTime">Pickup Time *</label>
          <select id="pickupTime" required>
            <option value="">Choose Time</option>
            <option>9:00 AM - 11:00 AM</option>
            <option>11:00 AM - 1:00 PM</option>
            <option>2:00 PM - 4:00 PM</option>
            <option>4:00 PM - 6:00 PM</option>
          </select>
        </div>

        <div class="booking-field full">
          <label for="pickupAddress">Pickup Address *</label>
          <textarea id="pickupAddress" rows="3"
            placeholder="Enter your complete pickup address"
            required></textarea>
        </div>

        <div class="booking-field full">
          <label for="instructions">Additional Instructions</label>
          <textarea id="instructions" rows="2"
            placeholder="Any special instructions?"></textarea>
        </div>

      </div>

      <button type="submit" class="booking-submit">
        Confirm Pickup
        <i class="fa-solid fa-arrow-right"></i>
      </button>

      <p class="booking-message" id="bookingMessage"
        role="status" aria-live="polite"></p>

    </form>

    <div class="booking-back">
      <a href="index.html">
        <i class="fa-solid fa-arrow-left"></i>
        Back to Home
      </a>
    </div>

  </section>

</main>

<script>
document.addEventListener("DOMContentLoaded", function () {

  const form = document.getElementById("pickupForm");
  const dateInput = document.getElementById("pickupDate");
  const message = document.getElementById("bookingMessage");

  // Set minimum pickup date to today
  const today = new Date();
  const localToday = new Date(
    today.getTime() - today.getTimezoneOffset() * 60000
  ).toISOString().split("T")[0];

  dateInput.min = localToday;

  // Submit booking
  form.addEventListener("submit", function (event) {

    event.preventDefault();

    if (!form.reportValidity()) return;

    const booking = {
      id: "LAV" + Date.now(),
      customer: document.getElementById("customerName").value.trim(),
      phone: document.getElementById("customerPhone").value.trim(),
      email: document.getElementById("customerEmail").value.trim(),
      service: document.getElementById("service").value,
      date: dateInput.value,
      time: document.getElementById("pickupTime").value,
      address: document.getElementById("pickupAddress").value.trim(),
      notes: document.getElementById("instructions").value.trim(),
      status: "Pending",
      createdAt: new Date().toISOString()
    };

    try {

      const bookings = JSON.parse(
        localStorage.getItem("laveraBookings") || "[]"
      );

      if (!Array.isArray(bookings)) {
        throw new Error("Invalid booking storage");
      }

      bookings.push(booking);

      localStorage.setItem(
        "laveraBookings",
        JSON.stringify(bookings)
      );

      message.textContent =
        "Pickup request submitted successfully! Your Booking ID: " + booking.id;

      form.reset();
      dateInput.min = localToday;

    } catch (error) {

      message.textContent =
        "Unable to save your booking. Please try again.";

    }

  });

});
</script>

</body>
</html>
